name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Verify JVM tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Verify UI and accessibility resources
        run: ./gradlew verifyAccessibilityResources verifyUiTextResources --stacktrace

      - name: Verify dual-theme screenshots
        run: ./gradlew :core:core-designsystem:verifyRoborazziDebug --stacktrace

      - name: Verify Compose performance budget
        run: >-
          ./gradlew verifyComposePerformanceBudget
          -Pkixyu.compose.reports=true
          --stacktrace

      - name: Verify Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Verify debug build
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify release build
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Enable KVM for Android emulator
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Verify database backup on managed device
        run: >-
          ./gradlew :core:core-database:pixel2Api35DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --stacktrace

      - name: Upload screenshot comparisons
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-comparisons
          path: '**/build/outputs/roborazzi/*_compare.png'
          if-no-files-found: ignore
