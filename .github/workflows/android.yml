name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: 'Also run the optional managed-emulator database checks'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Verify device-free regressions
        run: ./gradlew verifyHostTests --continue --stacktrace

      - name: Verify Compose performance budget
        run: >-
          ./gradlew verifyComposePerformanceBudget
          -Pkixyu.compose.reports=true
          --stacktrace

      - name: Verify debug build
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify release build
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Enable KVM for Android emulator
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_device_tests }}
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Verify database backup on managed device
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_device_tests }}
        run: >-
          ./gradlew :core:core-database:pixel2Api35DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --stacktrace

      - name: Upload screenshot comparisons
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-comparisons
          path: '**/build/outputs/roborazzi/*_compare.png'
          if-no-files-found: ignore

      - name: Upload local regression reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: host-regression-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/testDebugUnitTest/*.xml
            **/build/reports/lint-results-debug.*
            **/src/test/screenshots/*_compare.png
          if-no-files-found: ignore
